<!-- Details: Panel container component template with title, status badge, fail-soft state, and timestamp -->

<!--
Panel Container Component
- Reusable panel template for dashboard engine
- Supports title, status badge (healthy/warning/critical)
- Fail-soft state display ("Metric unavailable")
- Last updated timestamp
- Refresh interval support
-->

<div class="panel" 
     data-panel-id="{{ panel_id }}"
     data-x="{{ panel_x }}" 
     data-y="{{ panel_y }}" 
     data-w="{{ panel_w }}" 
     data-h="{{ panel_h }}"
     {% if refresh_interval %}data-refresh-interval="{{ refresh_interval }}"{% endif %}
     style="grid-column: span {{ panel_w }}; grid-row: span {{ panel_h }}">
    
    <!-- Panel Header -->
    <div class="panel-header">
        <div class="panel-title">{{ panel_title }}</div>
        <div class="panel-status-group">
            <span class="status-badge status-{{ panel_status }}">{{ panel_status }}</span>
            <span class="panel-timestamp" data-timestamp="{{ last_updated }}"></span>
        </div>
    </div>
    
    <!-- Panel Body -->
    <div class="panel-body">
        {% if panel_content %}
            {{ panel_content|safe }}
        {% else %}
            <div class="panel-unavailable">Metric unavailable</div>
        {% endif %}
    </div>
</div>
